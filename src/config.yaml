site:
  name: EIKON Guyana Inc.
  site: 'https://eikonguyana.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: EIKON Guyana Inc.
    template: '%s — EIKON Guyana Inc.'
  description: 'Engineering, construction, and green energy solutions across Guyana — power generation, highway & road construction, building design, net-zero solar & wind, drainage & irrigation, and water distribution.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: EIKON Guyana Inc.
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@eikonguyana'
    site: '@eikonguyana'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light'
